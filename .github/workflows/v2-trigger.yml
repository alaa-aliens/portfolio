name: Rebuild with v2

# Only `main` may publish to Pages, so a push to v2 asks main's deploy to run
# (it always builds main for the live site + v2 into /v2/).
on:
  push:
    branches: [v2]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
